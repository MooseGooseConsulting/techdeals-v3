name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PRs share github.head_ref so a newer push cancels the superseded run.
# Pushes have an empty head_ref, so github.run_id makes each run unique.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Rules live in .markdownlint.jsonc.
      - uses: DavidAnson/markdownlint-cli2-action@3ce8f712b5d8f31acd8e201be6d97e3d2bb23eb7 # v25.1.0
        with:
          globs: '**/*.md'

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The gitleaks CLI from its official Docker Hub image, not gitleaks/gitleaks-action:
      # the action needs a GITLEAKS_LICENSE secret in an organization-owned repository.
      # --redact keeps matched secrets out of this public log. Scans the full git history.
      # The container runs as root on a workspace owned by the runner user, so git needs
      # safe.directory; the image's own setting is not read because HOME is /github/home.
      - name: Scan for committed secrets
        uses: docker://docker.io/zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          args: git --redact --verbose --no-banner .
